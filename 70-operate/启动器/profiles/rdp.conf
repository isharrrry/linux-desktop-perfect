# RDP 验证配置（推荐用于远程桌面 / VirtualBox 等远程会话）
# 用法：bash 70-operate/启动器/sourcetree --profile rdp
#
# 关键项说明：
#   WPF_LINUX_ATSPI=0  必需（K-1379：缺了 UI 线程卡在 AT-SPI 初始化，窗口不出现 = 白屏）
#   DOTNET_ReadyToRun=0 必需（避免 R2R 代码在 shim 下崩溃）
#   DISPLAY            留空则用调用方环境，默认 :303

DOTNET_ReadyToRun=0
WPF_LINUX_ATSPI=0
WPF_LINUX_WIN32_SHIM=auto
DOTNET_ROOT=~/.local/share/ldp/dotnet
FX=~/.local/share/ldp/dotnet/shared/Microsoft.WindowsDesktop.App/10.0.11
APP=/tmp/stpkg/SourceTree/app-3.4.15
DISPLAY=
