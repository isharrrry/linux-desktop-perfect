# Xvfb 第二实例（双实例并行验证用）：独立 APP 副本 + 独立 XDG_DATA_HOME
# 用法：bash 70-operate/启动器/sourcetree --profile xvfb-b --no-kill
DOTNET_ReadyToRun=0
WPF_LINUX_ATSPI=0
WPF_LINUX_WIN32_SHIM=auto
DOTNET_ROOT=~/.local/share/ldp/dotnet
FX=~/.local/share/ldp/dotnet/shared/Microsoft.WindowsDesktop.App/10.0.11
APP=/tmp/stpkg/SourceTree/app-b
DISPLAY=:304
XDG_DATA_HOME=/tmp/xdg-b
WPF_LINUX_UI_FONT=Noto Sans CJK SC
