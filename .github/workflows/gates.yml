# 门禁 workflow（登记 + 可复跑）
#
# 注意：本仓远程是 Gitee（git@gitee.com:the50w/linux-desktop-perfect.git），
# GitHub Actions 不会在 Gitee 上执行本文件。它的作用有二：
#   1) 在 GitHub 镜像上真跑 `50-verify/gates.sh`（任何 Linux + node20 + gcc 可复现）；
#   2) 供 Software Assessment Kit 的 build_registry 统计（kit 只认 .github/workflows/*.yml，
#      并按文件系统 glob `**/*.csproj` 统计分母；下面的清单按同一 glob 生成）。
# 本文件**不含**本机专属依赖（不引用本机运行时目录、临时示例包、虚拟显示或截图工具）。
name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 文档门禁 + C ABI 断言
        run: bash 50-verify/gates.sh
      - name: 覆盖率闸门登记（coverage；不是行覆盖率，口径见脚本头）
        run: bash 50-verify/coverage.sh

