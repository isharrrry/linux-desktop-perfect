# LinuxDesktopPerfect 运行时本体（业务本体）
# 唯一的「类/关系/规则/动作/术语/裁决/排除」事实源；不新增语义，类的 source 逐条指向设计文档。
# 校验：python3 本体/本体校验.py；说明：本体/本体说明.md
ontology:
  name: LinuxDesktopPerfect 运行时本体
  domain: WindowsDesktop（WPF 全量 + WinForms 兼容层）在 Linux 上的源码级替代运行时
  version: "0.1"
  built_at: "2026-10-30"
  inputs:
    - "20-spec/需求与验收判据文档.md"
    - "30-design/概要设计.md"
    - "30-design/设计文档包/00~08 + 界面设计说明.md"
    - "70-operate/已知坑清单.md"
  degraded_note: >-
    本项目尚无任何实测判据读数（实现未开始），本体里的规则全部由设计文档推导，
    没有一条被运行验证过；因此 rules.confidence 不得为 high，最多 medium。
  regenerate_when: >-
    概设的 ADR/MOD/SYS/R 增删、04 的 IF 增删、05 的 TBL 增删、界面 SCR/GAP 增删、
    08 的 TG 增删、或 70-operate 缺陷册编号变化时重跑；纯文字修订、改链接、改名不触发。

classes:
  - id: C001
    id_en: Session
    name_zh: 应用会话
    source: "03 §4.3.1（SM-001）、02 §12"
    description: 一次应用进程从宿主加载 pack 到退出的生命周期载体，承载窗口与框架包。
    properties:
      - { key: session_id, type: string, description: 会话标识，进程内唯一 }
      - { key: pack_version, type: string, description: 解析到的 Microsoft.WindowsDesktop.App 版本，须为 10.0.x }
      - { key: state, type: enum, enum_values: [Loading, Starting, Running, ShuttingDown, Terminated], description: 会话状态，转移见 SM-001 }
      - { key: exit_code, type: integer, description: 退出码，0 正常 / 1 判据红 / 2 契约不符 / 3 环境缺失 / 4 降级完成 }

  - id: C002
    id_en: Window
    name_zh: 窗口
    source: "03 §3.2.1（MOD-11）、03 §4.3.2（SM-002）、04 §2.2（IF-002）"
    description: X11 上的一次窗口生命周期；Windows 句柄与 X11 Window 一一映射。
    properties:
      - { key: window_id, type: string, description: 自产句柄表的窗口标识 }
      - { key: title, type: string, description: 标题文本，投影到可访问名称 }
      - { key: bounds, type: object, description: 屏幕绝对像素矩形（多屏与负坐标按 X11 原值，见 GAP-011） }
      - { key: dpi_scale, type: float, description: per-monitor 缩放比，1.0/1.25/1.5/2.0 }
      - { key: composited, type: boolean, description: 合成器可用性，false 时走 DwmIsCompositionEnabled=false 路径 }

  - id: C003
    id_en: Message
    name_zh: 消息
    source: "03 §3.2.2（MOD-12）、04 §2.2（IF-002）"
    description: 消息泵里的一条 Windows 语义消息，由 XEvent 翻译而来。
    properties:
      - { key: msg_id, type: string, description: 消息标识 }
      - { key: type, type: enum, enum_values: [paint, resize, key, pointer, wheel, focus, close, timer], description: 消息类 }
      - { key: hwnd, type: string, description: 目标窗口标识 }
      - { key: wparam, type: integer, description: 消息参数一 }
      - { key: lparam, type: integer, description: 消息参数二 }

  - id: C004
    id_en: DeviceContext
    name_zh: 设备上下文
    source: "03 §3.2.3（MOD-13）、04 §2.3（IF-003）"
    description: GDI/GDI+ 的绘制目标与度量上下文，Linux 侧映射到 X11 Drawable 或内存位图。
    properties:
      - { key: dc_id, type: string, description: 上下文标识 }
      - { key: target, type: enum, enum_values: [window, bitmap], description: 绘制目标类型 }
      - { key: clip, type: object, description: 裁剪矩形 }
      - { key: dpi, type: integer, description: 上下文 DPI，用于字体度量 }

  - id: C005
    id_en: PixelSurface
    name_zh: 像素缓冲
    source: "03 §3.3.4（MOD-24）、04 §3.4（IF-014）"
    description: 一帧的像素结果，最终经 XPutImage/XCB 呈现到窗口。
    properties:
      - { key: surface_id, type: string, description: 缓冲标识 }
      - { key: width, type: integer, description: 宽度（像素） }
      - { key: height, type: integer, description: 高度（像素） }
      - { key: format, type: enum, enum_values: [bgra8888, rgba8888, a8], description: 像素格式 }
      - { key: stride, type: integer, description: 行跨距（字节） }

  - id: C006
    id_en: VisualTree
    name_zh: 视觉树
    source: "03 §3.3.2（MOD-22）、03 §3.8.1（MOD-81）"
    description: 托管侧视觉对象的投影，是无障碍节点与 DUCE 命令的共同来源。
    properties:
      - { key: tree_id, type: string, description: 树标识 }
      - { key: node_count, type: integer, description: 节点数 }
      - { key: dirty_region, type: object, description: 待重绘区域 }

  - id: C007
    id_en: CommandStream
    name_zh: DUCE 命令流
    source: "03 §3.3.1（MOD-21）、04 §3.1（IF-011）"
    description: 托管层与 milcore 之间唯一的绘制契约：118 条命令的字节流。
    properties:
      - { key: batch_id, type: string, description: 批次标识 }
      - { key: command_count, type: integer, description: 本批命令条数 }
      - { key: byte_length, type: integer, description: 字节长度 }
      - { key: fence, type: integer, description: 帧序号，用于呈现同步 }

  - id: C008
    id_en: ResourceHandle
    name_zh: 资源句柄
    source: "03 §3.3.2（MOD-22）、04 §3.2（IF-012）"
    description: milcore 内资源表的一条引用计数条目，命令通过它引用画刷/几何/位图/字形。
    properties:
      - { key: handle_id, type: string, description: 句柄标识 }
      - { key: type, type: enum, enum_values: [brush, geometry, bitmap, font, glyphrun, effect], description: 资源类 }
      - { key: refcount, type: integer, description: 引用计数，归零释放 }
      - { key: owner_window, type: string, description: 归属窗口，窗口销毁时整组回收 }

  - id: C009
    id_en: GlyphRun
    name_zh: 字形运行
    source: "03 §3.4.2（MOD-32）、03 §3.4.5（MOD-35）"
    description: 一段已 shaped 的字形与步进序列，跨到 milcore 时只带字形 id 与位置。
    properties:
      - { key: run_id, type: string, description: 运行标识 }
      - { key: font_face, type: string, description: 字形来源字体面 }
      - { key: glyph_ids, type: array, description: 字形 id 序列 }
      - { key: advances, type: array, description: 每字形步进 }
      - { key: bidi_level, type: integer, description: 双向文本层级 }

  - id: C010
    id_en: FontFamily
    name_zh: 字体族
    source: "03 §3.4.1（MOD-31）、05 §3.5（TBL-005）"
    description: fontconfig 枚举出的字体族与它的回退链。
    properties:
      - { key: family, type: string, description: 族名 }
      - { key: fallback_chain, type: array, description: 回退链，按命中顺序 }
      - { key: source, type: string, description: 来源（fontconfig 版本与配置文件） }

  - id: C011
    id_en: BitmapSource
    name_zh: 图像源
    source: "03 §3.5.1（MOD-41）、03 §3.5.2（MOD-42）"
    description: 经 WIC 解码与 ICC 转换后的图像，交由 Skia 绘制。
    properties:
      - { key: image_id, type: string, description: 图像标识 }
      - { key: mime, type: enum, enum_values: [png, jpeg, gif, bmp, tiff], description: 源格式 }
      - { key: width, type: integer, description: 像素宽 }
      - { key: height, type: integer, description: 像素高 }
      - { key: icc_profile, type: string, description: 嵌入的 ICC 描述或 none }

  - id: C012
    id_en: FrameworkPack
    name_zh: 框架包
    source: "03 §3.6.1（MOD-51）、03 §3.6.2（MOD-52）、04 §4（IF-021~024）"
    description: 自产的 Microsoft.WindowsDesktop.App Ref / Runtime 包，是应用工程接入的唯一途径。
    properties:
      - { key: pack_id, type: string, description: 包标识 }
      - { key: kind, type: enum, enum_values: [ref, runtime], description: Ref 还是 Runtime }
      - { key: version, type: string, description: 版本，须对齐 10.0.x }
      - { key: rid, type: string, description: Runtime 的 RID，V1 只允许 linux-x64 }

  - id: C013
    id_en: Assembly
    name_zh: 程序集
    source: "03 §3.1.4（MOD-04）、03 §3.1.2（MOD-02）"
    description: pack 内的一个托管程序集；自产件与上游件同名同身份。
    properties:
      - { key: assembly_name, type: string, description: 程序集简单名 }
      - { key: tfm, type: string, description: 目标框架，net10.0 }
      - { key: public_key_token, type: string, description: 公钥标记，与上游一致 }
      - { key: source, type: enum, enum_values: [self_built, upstream], description: 自产件还是直接取上游件 }

  - id: C014
    id_en: ContractFile
    name_zh: 契约文件
    source: "05 §0.3、05 §3.1~§3.3、05 §3.7"
    description: 四个仓内一等资产：出口清单、ABI 布局、DUCE 布局表、FrameworkList。
    properties:
      - { key: file_name, type: string, description: 文件名 }
      - { key: kind, type: enum, enum_values: [exports, abi, duce_layout, framework_list], description: 契约种类 }
      - { key: version, type: string, description: 契约版本，独立于 pack 版本 }

  - id: C015
    id_en: AccessibleNode
    name_zh: 无障碍节点
    source: "04 §7.1（IF-051）、04 §9.1（IF-071）、界面 §0.3"
    description: AT-SPI 树上的一个可检测节点；界面判据的第一手数据。
    properties:
      - { key: path, type: string, description: 树内稳定路径（数字段 /），结构 diff 的 join 键 }
      - { key: role, type: enum, enum_values: [frame, panel, filler, push_button, entry, check_box, radio_button, combo_box, list, list_item, menu, menu_bar, menu_item, table, table_cell, page_tab, page_tab_list, slider, text, label, paragraph, status_bar, tool_bar, document_frame, drawing_area, image, application], description: AT-SPI 角色 }
      - { key: name, type: string, description: 可访问名称，空名视为缺陷 }
      - { key: states, type: array, description: 状态位集合 }
      - { key: actions, type: array, description: 可调用动作集合 }
      - { key: bounds, type: object, description: 屏幕绝对像素矩形（不参与结构 diff） }

  - id: C016
    id_en: InputEvent
    name_zh: 输入事件
    source: "03 §3.2.2（MOD-12）、03 §3.4.6（MOD-36）"
    description: 键盘/指针/滚轮/触摸的一次输入，可能来自 X11，也可能来自输入法。
    properties:
      - { key: event_id, type: string, description: 事件标识 }
      - { key: kind, type: enum, enum_values: [key, pointer, wheel, touch, ime], description: 事件类 }
      - { key: target_hwnd, type: string, description: 目标窗口 }
      - { key: modifiers, type: array, description: 修饰键状态 }

  - id: C017
    id_en: ImeComposition
    name_zh: 输入法会话
    source: "03 §3.4.6（MOD-36）、03 §4.3.4（SM-004）、04 §5.1（IF-031）"
    description: 一次预编辑到提交的输入法组合过程；经 D-Bus 与 ibus/fcitx5 交互。
    properties:
      - { key: composition_id, type: string, description: 组合标识 }
      - { key: preedit, type: string, description: 预编辑串 }
      - { key: candidates, type: array, description: 候选列表 }
      - { key: committed_text, type: string, description: 已提交文本 }

  - id: C018
    id_en: PrintJob
    name_zh: 打印作业
    source: "03 §3.8.2（MOD-82）、03 §4.3.5（SM-005）、04 §6.1（IF-041）"
    description: 一次 XPS 渲染到 CUPS 队列的作业；作业属性由 CIP 侧记录判定。
    properties:
      - { key: job_id, type: string, description: 作业标识 }
      - { key: queue, type: string, description: 目标队列 }
      - { key: pages, type: integer, description: 页数 }
      - { key: media, type: string, description: 介质，如 iso_a4_210x297mm }
      - { key: dpi, type: integer, description: 分辨率 }
      - { key: state, type: enum, enum_values: [pending, processing, completed, aborted], description: 作业状态 }

  - id: C019
    id_en: MediaSource
    name_zh: 媒体源
    source: "03 §3.8.3（MOD-83）、03 §4.3.6（SM-006）、04 §8.1（IF-061）"
    description: GStreamer playbin 的一个媒体源与它的状态机。
    properties:
      - { key: media_id, type: string, description: 媒体标识 }
      - { key: uri, type: string, description: 源地址 }
      - { key: container, type: string, description: 容器类型 }
      - { key: codec, type: string, description: 编解码器 }
      - { key: state, type: enum, enum_values: [null_state, ready, paused, playing, error], description: 播放状态 }

  - id: C020
    id_en: InkStroke
    name_zh: 笔迹笔画
    source: "03 §3.8.4（MOD-84）"
    description: 一次采集到的笔/触摸轨迹；无设备时降级不阻塞。
    properties:
      - { key: stroke_id, type: string, description: 笔画标识 }
      - { key: points, type: array, description: 轨迹点序列 }
      - { key: pressure_curve, type: array, description: 压感序列，可为空 }
      - { key: device, type: string, description: 设备名或 none }

  - id: C021
    id_en: Readout
    name_zh: 判据读数
    source: "08 §1.5、04 §9.3（IF-073）、05 §3.9（TBL-009）"
    description: 一条判据执行的结果文件；四值判定，SKIP 不等于 PASS。
    properties:
      - { key: readout_id, type: string, description: 读数标识（时间戳 + 序号） }
      - { key: acc, type: string, description: 对应验收判据编号 }
      - { key: tg, type: string, description: 对应测试门编号 }
      - { key: verdict, type: enum, enum_values: [PASS, FAIL, SKIP, DEGRADED], description: 判定值 }
      - { key: expect_ref, type: string, description: 期望文件定位（表 + 行键） }
      - { key: diff, type: array, description: 差异条目，FAIL 时必须非空 }

  - id: C022
    id_en: Defect
    name_zh: 缺陷项
    source: "70-operate/已知坑清单、05 §3.8（TBL-008）、04 §9.2（IF-072）"
    description: 一条降级或已知坑；四要素齐全才算降级。
    properties:
      - { key: defect_id, type: string, description: 编号（D-/K-/X-） }
      - { key: kind, type: enum, enum_values: [degrade, known_issue, undecided], description: 类别 }
      - { key: trigger, type: string, description: 触发条件 }
      - { key: return_code, type: string, description: 返回码或行为 }
      - { key: visible_behavior, type: string, description: 用户可见行为 }
      - { key: status, type: enum, enum_values: [open, closed], description: 状态 }

  - id: C023
    id_en: DerivedTree
    name_zh: 派生树
    source: "03 §1.3、03 §4.3.8（SM-008）、05 §7"
    description: applier 从上游快照生成的构建树；产物可再生，不入版本控制。
    properties:
      - { key: tree_sha, type: string, description: 派生树内容摘要 }
      - { key: upstream_sha, type: string, description: 上游快照提交 }
      - { key: applier_version, type: string, description: applier 版本 }
      - { key: generated_at, type: datetime, description: 生成时间（UTC） }

  - id: C024
    id_en: TestGate
    name_zh: 测试门
    source: "08 §2、08 §4、01 §4.6"
    description: 一组判据的集合；门的绿是交付前置条件，横切门不占 ACC。
    properties:
      - { key: gate_id, type: string, description: 门编号（TG-xxx） }
      - { key: scope, type: string, description: 覆盖范围（ACC 区间 / 非功能） }
      - { key: entry_command, type: string, description: 入口命令 }
      - { key: readout_dir, type: string, description: 读数目录 }

relations:
  - { id: RL001, from: C001, to: C002, predicate: 持有, description: 一个会话持有它创建的窗口 }
  - { id: RL002, from: C001, to: C012, predicate: 加载, description: 会话启动时解析并加载框架包 }
  - { id: RL003, from: C012, to: C013, predicate: 包含, description: 框架包包含若干程序集 }
  - { id: RL004, from: C014, to: C013, predicate: 约束, description: 契约文件约束程序集的入口与身份 }
  - { id: RL005, from: C002, to: C003, predicate: 接收, description: 窗口接收消息 }
  - { id: RL006, from: C002, to: C004, predicate: 拥有, description: 窗口拥有绘制上下文 }
  - { id: RL007, from: C004, to: C005, predicate: 绘制到, description: 上下文把内容绘制到像素缓冲 }
  - { id: RL008, from: C002, to: C007, predicate: 提交, description: 窗口按帧提交 DUCE 批次 }
  - { id: RL009, from: C007, to: C008, predicate: 引用, description: 命令流通过句柄引用资源 }
  - { id: RL010, from: C008, to: C002, predicate: 归属, description: 句柄归属窗口，窗口销毁整组回收 }
  - { id: RL011, from: C007, to: C005, predicate: 产出, description: 命令流渲染产生像素缓冲 }
  - { id: RL012, from: C006, to: C007, predicate: 投影为, description: 视觉树投影成命令流 }
  - { id: RL013, from: C009, to: C006, predicate: 属于, description: 字形运行是视觉树的一部分 }
  - { id: RL014, from: C010, to: C009, predicate: 提供, description: 字体族按回退链提供字形 }
  - { id: RL015, from: C011, to: C005, predicate: 解码为, description: 图像源解码后进入像素缓冲 }
  - { id: RL016, from: C015, to: C006, predicate: 映射, description: 无障碍节点由视觉树投影而来 }
  - { id: RL017, from: C016, to: C003, predicate: 转为, description: 输入事件翻译成消息 }
  - { id: RL018, from: C017, to: C016, predicate: 产生, description: 输入法会话产生输入事件 }
  - { id: RL019, from: C018, to: C007, predicate: 渲染, description: 打印作业渲染命令流到 XPS }
  - { id: RL020, from: C019, to: C005, predicate: 驱动, description: 媒体源驱动帧输出 }
  - { id: RL021, from: C020, to: C006, predicate: 进入, description: 笔迹进入视觉树 }
  - { id: RL022, from: C024, to: C021, predicate: 覆盖, description: 测试门覆盖若干读数 }
  - { id: RL023, from: C022, to: C021, predicate: 被引用, description: 读数与错误行引用缺陷编号 }
  - { id: RL024, from: C023, to: C013, predicate: 生成, description: 派生树生成自产程序集 }
  - { id: RL025, from: C002, to: C015, predicate: 暴露, description: 窗口暴露无障碍节点子树 }
  - { id: RL026, from: C016, to: C002, predicate: 投递到, description: 输入事件投递到目标窗口 }

rules:
  - id: R001
    condition: PTS（Lo*/Fs*/Nl*）入口缺失
    then: 返回 E_NOTIMPL 并记入口名，同时文本路径分流到托管行布局
    source: "03 §3.2.6（MOD-16）、ADR-007、R-002"
    confidence: medium
  - id: R002
    condition: 触达 DRM 受保护内容
    then: 返回 E_NOTIMPL，错误行带 D-001，不静默
    source: "DQ-001、ADR-012、MOD-85"
    confidence: medium
  - id: R003
    condition: pack 版本不等于 10.0.x，或清单缺件
    then: 启动失败，退出码 2，错误行给出缺的文件名
    source: "03 §4.3.1（SM-001）、REQ-FN-003、SAFE-018"
    confidence: medium
  - id: R004
    condition: 出口清单与实现不一致
    then: 契约对拍 TG-001 判红，停止合入
    source: "04 §2.6（IF-006）、TG-001"
    confidence: medium
  - id: R005
    condition: 跨边界结构体布局断言失败
    then: 编译失败，不允许带断言失败的实现出产物
    source: "SAFE-012、04 §1.2"
    confidence: medium
  - id: R006
    condition: 调用未实现的原生入口
