decisions:
  - { id: D01, topic: "06 章节号空档", status: 已修, detail: "补「安全性验证与判据汇总」为 §7，SAFE→TG 映射成表；§8~§11 编号不变。" }
  - { id: D02, topic: "MOD-86 与 MOD-36 一码两义", status: 已修, detail: "概设 §5 第 7 行（输入法）改指 MOD-36；MOD-86 定为「界面可检测契约」，不再与 IME 混用。" }
  - { id: D03, topic: "契约文件落点冲突", status: 已修, detail: "02 的 40-build/contracts/ 取消；exports.txt 与 win32_abi.h 在 native-shim，DUCE 布局表在 milcore，FrameworkList 在 pack。" }
  - { id: D04, topic: "构建侧目录名与子系统首选名不一致", status: 已修, detail: "40-build/text|wic|winforms 统一改为 text-stack|wic-dwrite|winforms-compat。" }
  - { id: D05, topic: "04 中「其余已实现」属未验证结论", status: 已修, detail: "改为「其余有源码，exports.txt 逐条登记，状态一律待对拍确认」。" }
  - { id: D06, topic: "PresentationNative 缺口计数口径", status: 已裁决, detail: "2026-10-30 按 10.0 快照实读：165 条声明（DllImport.PresentationNative 126 + PresentationNativeDll 39）、145 个唯一入口；126 条分类为 66 Fs* + 23 Lo* + 6 Nl* + 31 其他。旧「147 声明 / 100 缺失」作废，04 §2.5 与概设 ADR-007 已更正，差异进 TG-001。" }
  - { id: D07, topic: "FrameworkList 件数归属", status: 已裁决, detail: "2026-10-30 按 ref 包 10.0.11 的 FrameworkList.xml 实读：50 个运行时条目 + 5 个 Analyzer；Profile=WPF 21 件（15 程序集 + 6 主题）、WindowsForms;WPF 19 件、WindowsForms 9 件、无 Profile 1 件。20-spec §6「共享 16 件」更正为 19 件（补 System.Drawing.Common、System.Private.Windows.Core、System.Private.Windows.GdiPlus）。" }
  - { id: D08, topic: "01 §4.1 需求索引与 03 章节号错位", status: 已修, detail: "03 的 §3.x 按 SYS-1→SYS-8 顺序重排，01 索引随之对齐（MOD-21 归 §3.3、MOD-11 归 §3.2）。" }
  - { id: D09, topic: "无障碍桥排期与里程碑冲突", status: 已修, detail: "ADR-015 要求与首帧同期；M1 出口追加 ACC-027 结构部分，M5 改为「无障碍全量与合成」。" }
  - { id: D10, topic: "判据放宽与性能长期红的口径", status: 已裁决, detail: "放宽＝阈值变松/断言变少/SKIP 变多，须变更单+登记+前后读数；长期红＝断言不变但读数不达标，须登记 K-，两者不互相豁免（冲突组 CG-01）。" }
  - { id: D11, topic: "输入法候选窗不在 AT-SPI 树内", status: 已登记, detail: "登记 GAP-003，只用坐标换算 + 帧判据，不伪造树节点。" }
  - { id: D12, topic: "项目定位被写窄为「WPF 在 Linux」", status: 已修, detail: "2026-10-30 用户裁决：定位改为「WindowsDesktop 在 Linux 上源码级完整运行」，范围＝WPF 全量 + WinForms 兼容层；README/CONTRIBUTING/20-spec/概设/术语表同步。" }

excluded:
  - { concept: 二进制兼容（PE 加载/程序集身份仿真）, reason: "ADR-001 明确非目标；BAML 版本头与 4.0.0.0→4.0.0.1 绑定无法用补丁解决。" }
  - { concept: WinForms 设计器, reason: "UD-004 裁决不做；没有可验收的 Linux 落点。" }
  - { concept: ActiveX/DCOM 宿主, reason: "只做进程内 COM 桩，跨进程 DCOM 不在范围。" }
  - { concept: DRM 内容播放, reason: "DQ-001：返回 E_NOTIMPL，登记 D-001，不自研不绕过。" }
  - { concept: Wayland 后端, reason: "V2 平台扩展，V1 判据不含；窗口与输入只做 X11。" }
  - { concept: arm64, reason: "V2 平台扩展，V1 判据只覆盖 x64。" }
  - { concept: GPU 渲染后端, reason: "ADR-004：先有落点再谈性能，CPU/Skia 优先，GPU 后置。" }
  - { concept: GTK/Qt 系统主题映射, reason: "ADR-010：只做 WPF 原主题视觉复刻。" }
  - { concept: Windows IME 协议（IMM32/Tsf）仿真, reason: "ADR-008：接 ibus/fcitx5，不仿真 Windows 输入法协议。" }
  - { concept: WMP/Media Foundation 全格式, reason: "ADR-009：GStreamer 支持的格式为准，不支持必须报错。" }
  - { concept: 用户权限与访问控制模型, reason: "单用户桌面会话；SAFE-017 只约束不提权。" }
  - { concept: 数据库/持久化存储, reason: "本项目无数据库；契约文件与读数 JSON 即数据面（05 §0.1）。" }
