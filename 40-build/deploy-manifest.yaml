a11y_bus:
  address: "unix:path=/run/user/1000/at-spi/bus"
  why: "shim 解析顺序里 $XDG_RUNTIME_DIR/at-spi/bus 是第 6 条；无后缀路径不在就静默回退 session bus（probe 见 0 app）"
  start:
    - "setsid nohup /usr/bin/dbus-daemon --config-file=/usr/share/defaults/at-spi2/accessibility.conf --nofork --address=unix:path=/run/user/1000/at-spi/bus &"
    - "AT_SPI_BUS_ADDRESS=unix:path=/run/user/1000/at-spi/bus setsid nohup /usr/libexec/at-spi2-registryd &"
  verify: "gdbus call --address unix:path=/run/user/1000/at-spi/bus --dest org.a11y.atspi.Registry --object-path /org/a11y/atspi/accessible/root --method org.a11y.atspi.Accessible.GetChildren  =>  (@a(so) [],)"
  known_wrong: "用 --fork --print-address 11 起会 Failed to start message bus（无 launcher 提供 fd 11）；用 org.a11y.Bus 自动激活会得到 bus_0 后缀路径，应用不认"
  pgrep_note: "进程名 comm 截断为 15 字符，必须 pgrep -af at-spi2-registryd，pgrep -a 会假阴性"

