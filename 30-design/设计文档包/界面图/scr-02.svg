<svg xmlns="http://www.w3.org/2000/svg" width="860" height="498" viewBox="0 0 860 498" font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif">
<rect width="860" height="498" fill="#ffffff"/>
<text x="26" y="34" font-size="20" font-weight="700" fill="#111">SCR-02 文本与字体样本</text>
<text x="26" y="58" font-size="12" fill="#555">由《界面设计说明》§3 元素属性表生成：12 个可检测节点，3 层；左侧缩进表示 path 层级，右侧为 role · path · 状态/动作数</text>
<text x="26" y="74" font-size="11" fill="#8a8a8a">路径即结构判据的 join 键；图与表不一致时以表为准并重跑本脚本（--check 会红）</text>
<line x1="36" y1="74" x2="36" y2="432" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="60" y1="74" x2="60" y2="432" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 4"/>
<g data-path="0" data-role="frame" data-name="WpfTextDemo">
<rect x="26" y="78" width="808" height="24" rx="3" fill="#f7f7f7" stroke="#d0d0d0"/>
<text x="34" y="94" font-size="12" fill="#111">主窗口</text>
<text x="826" y="94" font-size="10" fill="#666" text-anchor="end">frame · 0 · 状态 3 / 动作 1 · ACC-009 ACC-027</text>
</g>
