<svg xmlns="http://www.w3.org/2000/svg" width="860" height="438" viewBox="0 0 860 438" font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif">
<rect width="860" height="438" fill="#ffffff"/>
<text x="26" y="34" font-size="20" font-weight="700" fill="#111">SCR-07 WinForms 兼容样本</text>
<text x="26" y="58" font-size="12" fill="#555">由《界面设计说明》§8 元素属性表生成：10 个可检测节点，4 层；左侧缩进表示 path 层级，右侧为 role · path · 状态/动作数</text>
<text x="26" y="74" font-size="11" fill="#8a8a8a">路径即结构判据的 join 键；图与表不一致时以表为准并重跑本脚本（--check 会红）</text>
<line x1="36" y1="74" x2="36" y2="372" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="60" y1="74" x2="60" y2="372" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="84" y1="74" x2="84" y2="372" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 4"/>
<g data-path="0" data-role="frame" data-name="WinFormsBasics">
<rect x="26" y="78" width="808" height="24" rx="3" fill="#f7f7f7" stroke="#d0d0d0"/>
<text x="34" y="94" font-size="12" fill="#111">主窗体</text>
<text x="826" y="94" font-size="10" fill="#666" text-anchor="end">frame · 0 · 状态 2 / 动作 1 · ACC-028 ACC-027</text>
</g>
<g data-path="0/0" data-role="push button" data-name="确定">
<rect x="50" y="108" width="784" height="24" rx="3" fill="#eef4ff" stroke="#7aa2e8"/>
<text x="58" y="124" font-size="12" fill="#111">Button</text>
<text x="826" y="124" font-size="10" fill="#666" text-anchor="end">push button · 0/0 · 状态 1 / 动作 1 · ACC-028 ACC-027</text>
</g>
<g data-path="0/1" data-role="entry" data-name="输入">
<rect x="50" y="138" width="784" height="24" rx="3" fill="#eef4ff" stroke="#7aa2e8"/>
<text x="58" y="154" font-size="12" fill="#111">TextBox</text>
<text x="826" y="154" font-size="10" fill="#666" text-anchor="end">entry · 0/1 · 状态 1 / 动作 1 · ACC-028 ACC-027</text>
</g>
<g data-path="0/2" data-role="list" data-name="列表">
<rect x="50" y="168" width="784" height="24" rx="3" fill="#f7f7f7" stroke="#d0d0d0"/>
<text x="58" y="184" font-size="12" fill="#111">ListBox</text>
<text x="826" y="184" font-size="10" fill="#666" text-anchor="end">list · 0/2 · 状态 1 / 动作 1 · ACC-028 ACC-027</text>
</g>
<g data-path="0/3" data-role="combo box" data-name="下拉">
<rect x="50" y="198" width="784" height="24" rx="3" fill="#f7f7f7" stroke="#d0d0d0"/>
<text x="58" y="214" font-size="12" fill="#111">ComboBox</text>
<text x="826" y="214" font-size="10" fill="#666" text-anchor="end">combo box · 0/3 · 状态 1 / 动作 1 · ACC-028 ACC-027</text>
</g>
<g data-path="0/4" data-role="panel" data-name="子窗体容器">
<rect x="50" y="228" width="784" height="24" rx="3" fill="#f7f7f7" stroke="#d0d0d0"/>
<text x="58" y="244" font-size="12" fill="#111">Form 内嵌面板</text>
<text x="826" y="244" font-size="10" fill="#666" text-anchor="end">panel · 0/4 · 状态 1 / 动作 0 · ACC-028 ACC-027</text>
</g>
<g data-path="0/5" data-role="menu bar" data-name="菜单">
<rect x="50" y="258" width="784" height="24" rx="3" fill="#f7f7f7" stroke="#d0d0d0"/>
<text x="58" y="274" font-size="12" fill="#111">MenuStrip</text>
<text x="826" y="274" font-size="10" fill="#666" text-anchor="end">menu bar · 0/5 · 状态 1 / 动作 0 · ACC-028 ACC-027</text>
</g>
<g data-path="0/5/0/0" data-role="menu item" data-name="文件">
<rect x="98" y="288" width="736" height="24" rx="3" fill="#f7f7f7" stroke="#d0d0d0"/>
<text x="106" y="304" font-size="12" fill="#111">末级菜单项</text>
<text x="826" y="304" font-size="10" fill="#666" text-anchor="end">menu item · 0/5/0/0 · 状态 1 / 动作 1 · ACC-028 ACC-027</text>
</g>
<g data-path="0/6" data-role="filler" data-name="正则 缺失控件.*D-\d{3}">
<rect x="50" y="318" width="784" height="24" rx="3" fill="#f7f7f7" stroke="#d0d0d0"/>
<text x="58" y="334" font-size="12" fill="#111">缺失控件占位</text>
<text x="826" y="334" font-size="10" fill="#666" text-anchor="end">filler · 0/6 · 状态 1 / 动作 0 · ACC-028 ACC-027</text>
</g>
<g data-path="0/7" data-role="label" data-name="正则 msaa=(on|off)">
<rect x="50" y="348" width="784" height="24" rx="3" fill="#f7f7f7" stroke="#d0d0d0"/>
<text x="58" y="364" font-size="12" fill="#111">MSAA 桥读数</text>
<text x="826" y="364" font-size="10" fill="#666" text-anchor="end">label · 0/7 · 状态 1 / 动作 0 · ACC-028 ACC-027</text>
</g>
<text x="26" y="414" font-size="10" fill="#8a8a8a">蓝框＝可交互节点（Button/Entry/Check/Radio/Slider 类）；全部节点须能在 AT-SPI 树快照中按 path 命中（TG-012 / ACC-027）</text>
</svg>
